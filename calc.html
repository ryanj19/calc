<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.calculator{
    width:360px;
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.display{
    margin-bottom:20px;
}

#history{
    height:25px;
    color:#888;
    text-align:right;
    font-size:.9rem;
    overflow:hidden;
}

#display{
    width:100%;
    height:70px;
    background:#111;
    border:none;
    outline:none;
    color:white;
    font-size:2.5rem;
    text-align:right;
    padding:10px;
    border-radius:10px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:12px;
    background:#2d2d2d;
    color:white;
    font-size:1.3rem;
    cursor:pointer;
    transition:.2s;
}

button:hover{

}

button:active{
    transform:scale(.95);
}

.operator{
    background:#ff9500;
}

.operator:hover{
    background:#ffac33;
}

.equals{
    background:#00b894;
}

.equals:hover{
    background:#00d6a8;
}

#clear{

}

#clear:hover{
    background:#ff5252;
}

#delete{

}

#delete:hover{

button.pressed {

    filter: brightness(1.2);
}
#sixseven{

video {

    position: fixed;

body.splitFlash {

        black 50%,
        black 100%

body.splitFlashReverse {

    <button data-key="F9" onclick="toggleSign()">±</button>
    <button class="number" data-key="0" onclick="appendNumber('0')">0</button>
    <button data-key="." onclick="appendDecimal()">.</button>

<script>
    
    function animateButton(key) {
    const button = document.querySelector(`[data-key="${key}"]`);

    if (!button) return;

    button.classList.add("pressed");

    setTimeout(() => {
        button.classList.remove("pressed");
    }, 100);
}

document.addEventListener("keydown", function (event) {
    const key = event.key;

    animateButton(key);

    if (key >= "0" && key <= "9") {
        appendNumber(key);
    }

    else if (key === "+" || key === "-" || key === "*" || key === "/") {
        appendOperator(key);
    }

    else if (key === ".") {
        appendDecimal();
    }

    else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
    }

    else if (key === "Backspace") {
        deleteLast();
    }

    else if (key === "Escape") {
        clearDisplay();
    }

    else if (key === "%") {
        percent();
    }
    else if (key === "F9") {
        event.preventDefault();
        toggleSign();
    }
});

function appendNumber(number) {
    animateButton(number);
    document.getElementById("display").value += number;
}

function appendOperator(operator) {
    const display = document.getElementById("display");
    let value = display.value;

    if (value === "") return;

    const lastChar = value[value.length - 1];

    if ("+-*/".includes(lastChar)) {
        display.value = value.slice(0, -1) + operator;
    } else {
        display.value += operator;
    }

    animateButton(operator);
}

function appendDecimal() {
    const display = document.getElementById("display");
    let value = display.value;

    const lastNumber = value.split(/[+\-*/]/).pop();

    if (lastNumber.includes(".")) return;

    if (value === "" || "+-*/".includes(value.slice(-1))) {
        display.value += "0.";
    } else {
        display.value += ".";
    }

    animateButton(".");
}

function clearDisplay() {
    animateButton("Escape");
    document.getElementById("display").value = "";
}

function deleteLast() {
    animateButton("Backspace");
    let display = document.getElementById("display");
    display.value = display.value.slice(0, -1);
}

function percent() {
    animateButton("%");

    const display = document.getElementById("display");

    if (display.value !== "") {
        display.value = Number(display.value) / 100;
    }
}

function toggleSign() {
    const display = document.getElementById("display");

    if (display.value !== "") {
        display.value = Number(display.value) * -1;
    }
}

function calculate() {
    animateButton("Enter");

    const display = document.getElementById("display");
    const history = document.getElementById("history");

    try {
        const expression = display.value;
        const result = eval(expression);

        history.textContent = expression + " =";
        display.value = result;
        
        if (expression === "1+1") {
            history.textContent = expression + " =";
            display.value = "I miss you";
            return;
        }

        if (expression === "1+0"){
            playSong2();
        }


        if (expression === "6+9") {
            display.value = "nice";
        }

        if (result === 69) {
            display.value = "nice";
        }

        if (Number(result) === 67 || expression === "6+7") {
            display.value = "67"
            play67();
        }

        if (expression === "2+2") {
            playVideo();
        }

        if (Number(result) === 143) {
            playSong();
        }
        
        }   catch (err) {
        console.error(err);
        display.value = "Syntax Error";
    }
}

function startSplitFlash(speed = 100) {

    stopSplitFlash(); 

    let flipped = false;

    splitInterval = setInterval(() => {

        if (flipped) {
            document.body.classList.add("splitFlash");
            document.body.classList.remove("splitFlashReverse");
        } else {
            document.body.classList.add("splitFlashReverse");
            document.body.classList.remove("splitFlash");
        }

        flipped = !flipped;

    }, speed);
}

function stopSplitFlash() {
    clearInterval(splitInterval);
    splitInterval = null;

    document.body.classList.remove("splitFlash");
    document.body.classList.remove("splitFlashReverse");

}
